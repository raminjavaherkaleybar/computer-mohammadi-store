<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><title>استعلام ضمانت‌نامه | رام‌تک</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1d2939;font:14px/2 Tahoma,Arial,sans-serif}.wrap{width:min(620px,94%);margin:35px auto}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:18px;padding:22px;box-shadow:0 12px 30px #172b430d}h1{font-size:21px;margin-top:0}label{display:block;font-size:12px;margin:12px 0 4px;color:#596a80}input{width:100%;padding:12px;border:1px solid #d7e0eb;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;background:#b68b3e;color:#fff;padding:11px 18px;font:inherit;font-weight:bold;margin-top:14px;cursor:pointer}.msg{margin-top:14px}.result{border:1px solid #dce4ed;border-radius:12px;padding:14px;margin-top:14px;background:#f8fafc}.muted{color:#738198;font-size:12px}a{color:#88621f}</style></head><body><main class="wrap"><section class="panel"><h1>استعلام ضمانت‌نامه رام‌تک</h1><p class="muted">برای حفاظت از اطلاعات مشتری، استعلام فقط با واردکردن هم‌زمان کد ضمانت‌نامه و شماره موبایل ثبت‌شده امکان‌پذیر است.</p><label for="code">کد ضمانت‌نامه</label><input id="code" autocomplete="off" placeholder="مثلاً RT-XXXXXXXXXX"><label for="phone">شماره موبایل خریدار</label><input id="phone" inputmode="tel" autocomplete="tel" placeholder="09xxxxxxxxx"><button class="btn" id="check">بررسی ضمانت</button><div class="msg" id="status" role="status"></div><div id="result"></div><p class="muted" style="margin-top:20px"><a href="./index.html">بازگشت به فروشگاه رام‌تک</a></p></section></main><script>
(()=>{'use strict';const URL='https://fgfeiilkzoajguabzuex.supabase.co/rest/v1/rpc/verify_warranty',KEY='sb_publishable_pJ4jaKNQJA35B1kYmrtxWw_zPSuMMRB',fa=s=>String(s||'').replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[Number(d)]);const $=id=>document.getElementById(id);$('check').onclick=async()=>{const code=$('code').value.trim(),phone=$('phone').value.replace(/[^0-9۰-۹٠-٩]/g,'');$('status').textContent='در حال بررسی...';$('result').innerHTML='';$('check').disabled=true;try{const r=await fetch(URL,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_warranty_code:code,p_phone:phone})});if(!r.ok)throw new Error('ارتباط با سامانه استعلام برقرار نشد.');const d=await r.json();if(!d){$('status').textContent='ضمانت‌نامه‌ای با این کد و شماره موبایل پیدا نشد.';return}const status=d.status==='active'?'معتبر':d.status==='expired'?'منقضی‌شده':'باطل‌شده';$('status').textContent='اطلاعات ضمانت پیدا شد.';$('result').innerHTML='<div class="result"><b>وضعیت: '+status+'</b><div>کالا: '+esc(d.product_name)+'</div><div>نام مشتری: '+esc(d.customer_name)+'</div><div>کد ضمانت: '+esc(d.warranty_code)+'</div><div>شماره سریال: '+esc(d.serial_number||'ثبت نشده')+'</div><div>تاریخ خرید: '+esc(fa(d.purchased_at))+'</div><div>پایان ضمانت: '+esc(fa(d.expires_at||'بدون تاریخ پایان'))+'</div><p class="muted">این نتیجه بر اساس اطلاعات ثبت‌شده در سامانه رام‌تک است.</p></div>'}catch(e){$('status').textContent=e.message}finally{$('check').disabled=false}};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
})();
</script></body></html>
