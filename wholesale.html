<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="index,follow"><meta name="description" content="درخواست قیمت همکاری و خرید عمده لوازم جانبی موبایل و کامپیوتر از رام‌تک."><title>خرید عمده و قیمت همکاری | رام‌تک</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1d2939;font:15px/1.9 Tahoma,Arial,sans-serif}.wrap{width:min(720px,94%);margin:26px auto}.panel{background:#fff;border:1px solid #e2e8f0;border-radius:17px;padding:22px;box-shadow:0 10px 28px #172b490c}h1{font-size:22px;margin:0}p{color:#718096;font-size:13px}label{display:block;font-size:12px;margin:10px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #d5deea;border-radius:10px;font:inherit}textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:10px;padding:12px 18px;background:#b38a3e;color:#fff;font:inherit;font-weight:700;margin-top:14px;cursor:pointer}.msg{margin-top:12px;font-size:13px}@media(max-width:580px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><section class="panel"><a href="./" style="color:#8a6729">← بازگشت به رام‌تک</a><h1>درخواست خرید عمده و قیمت اختصاصی</h1><p>قیمت عمده پس از بررسی تعداد، موجودی واقعی و شرایط ارسال اعلام می‌شود. ثبت فرم به‌تنهایی به معنی تأیید قیمت یا موجودی نیست.</p>
<form id="wholesale"><div class="grid"><div><label>نام و نام خانوادگی *</label><input id="name" required minlength="2" maxlength="100"></div><div><label>نام فروشگاه / کسب‌وکار</label><input id="business" maxlength="120"></div><div><label>شماره موبایل *</label><input id="phone" required inputmode="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹"></div><div><label>شهر</label><input id="city" maxlength="80"></div><div><label>تعداد تقریبی کل</label><input id="qty" type="number" min="1" max="100000" placeholder="مثلاً ۲۰"></div></div><label>محصولات موردنظر و تعداد هرکدام *</label><textarea id="interest" required minlength="3" maxlength="1500" placeholder="مثلاً کابل Type-C: ۲۰ عدد، شارژر: ۱۰ عدد..."></textarea><label>توضیحات تکمیلی</label><textarea id="details" maxlength="1200"></textarea><button class="btn" type="submit">ارسال درخواست همکاری</button><div id="msg" class="msg" aria-live="polite"></div></form></section></main>
<script>
const URL='https://fgfeiilkzoajguabzuex.supabase.co',KEY='sb_publishable_pJ4jaKNQJA35B1kYmrtxWw_zPSuMMRB';const norm=s=>String(s||'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d))).replace(/\D/g,'');
document.getElementById('wholesale').onsubmit=async e=>{e.preventDefault();const phone=norm(document.getElementById('phone').value),msg=document.getElementById('msg');if(!/^09\d{9}$/.test(phone)){msg.textContent='شماره موبایل معتبر نیست.';return}const qty=document.getElementById('qty').value;msg.textContent='در حال ارسال...';try{const r=await fetch(URL+'/rest/v1/wholesale_inquiries',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify({contact_name:document.getElementById('name').value.trim(),business_name:document.getElementById('business').value.trim()||null,phone,city:document.getElementById('city').value.trim()||null,estimated_quantity:qty?Number(qty):null,product_interest:document.getElementById('interest').value.trim(),details:document.getElementById('details').value.trim()||null})});if(!r.ok)throw Error('درخواست ثبت نشد؛ لطفاً دوباره تلاش کنید.');msg.textContent='درخواست شما ثبت شد. برای اعلام قیمت و شرایط همکاری با شما تماس گرفته می‌شود.';e.target.reset()}catch(err){msg.textContent=err.message}};
</script></body></html>
