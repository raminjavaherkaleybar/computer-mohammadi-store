<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>گفت‌وگوی پشتیبانی | رام‌تک</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#1d2939;font:14px/2 Tahoma,Arial,sans-serif}.wrap{width:min(680px,94%);margin:30px auto}.panel{background:#fff;border:1px solid #e1e7ef;border-radius:17px;padding:20px;box-shadow:0 10px 25px #172b430c}h1{font-size:20px;margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;font-size:12px;color:#65758b}input,textarea{width:100%;padding:11px;border:1px solid #d7e0eb;border-radius:10px;font:inherit}textarea{min-height:85px}.btn{border:0;border-radius:10px;background:#b68b3e;color:#fff;padding:10px 16px;font:inherit;font-weight:bold;cursor:pointer;margin-top:10px}.btn:disabled{opacity:.5}.log{background:#f7f9fc;border-radius:12px;padding:12px;margin:14px 0;min-height:90px;max-height:420px;overflow:auto}.bubble{padding:10px 12px;margin:7px 0;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-width:90%}.customer{background:#fff;border:1px solid #dce4ed;margin-left:auto}.admin{background:#e8f0fa;margin-right:auto}.muted{font-size:12px;color:#728096}.status{margin-top:10px;min-height:22px}@media(max-width:540px){.grid{grid-template-columns:1fr}.panel{padding:15px}}</style></head><body><main class="wrap"><section class="panel"><h1>گفت‌وگوی پشتیبانی رام‌تک</h1><p class="muted">برای حفظ حریم خصوصی، شماره تیکت و همان شماره موبایلی را وارد کنید که هنگام ثبت درخواست استفاده کرده‌اید. نیازی به ساخت حساب کاربری نیست.</p><div class="grid"><div><label for="ticket">شماره تیکت</label><input id="ticket" inputmode="numeric" placeholder="شماره پیگیری تیکت"></div><div><label for="phone">شماره موبایل</label><input id="phone" inputmode="tel" placeholder="09xxxxxxxxx"></div></div><button class="btn" id="load">نمایش گفت‌وگو</button><div id="status" class="status" role="status"></div><div id="log" class="log">برای شروع، شماره تیکت و موبایل را وارد کنید.</div><form id="send"><label for="message">پیام شما</label><textarea id="message" maxlength="3000" required placeholder="پیام خود را بنویسید..."></textarea><button class="btn" id="sendBtn">ارسال پیام</button></form><p class="muted">اگر هنوز تیکت ندارید، ابتدا از <a href="./support.html">فرم ثبت درخواست پشتیبانی</a> استفاده کنید.</p><p><a href="./index.html">بازگشت به فروشگاه</a></p></section></main><script>
(()=>{'use strict';const API='https://fgfeiilkzoajguabzuex.supabase.co/rest/v1/rpc/',KEY='sb_publishable_pJ4jaKNQJA35B1kYmrtxWw_zPSuMMRB',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let valid=false,busy=false;function args(){return {p_ticket_number:Number($('ticket').value.replace(/[^0-9]/g,'')),p_phone:$('phone').value.trim()}}async function call(name,body){const r=await fetch(API+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const e=await r.json().catch(()=>({}));throw new Error(e.message||'ارتباط با سامانه ناموفق بود.')}return r.json()}async function refresh(){if(busy)return;busy=true;try{const rows=await call('get_support_chat_messages',args());if(!Array.isArray(rows)||!rows.length){$('log').textContent='پیامی پیدا نشد. شماره تیکت و موبایل را بررسی کنید؛ اگر گفت‌وگو تازه ثبت شده، پس از چند لحظه دوباره تلاش کنید.';valid=false;return}valid=true;$('log').innerHTML=rows.map(m=>'<div class="bubble '+(m.sender==='admin'?'admin':'customer')+'"><b>'+(m.sender==='admin'?'پشتیبانی رام‌تک':'شما')+'</b><div>'+esc(m.message)+'</div><small class="muted">'+new Date(m.created_at).toLocaleString('fa-IR')+'</small></div>').join('');$('log').scrollTop=$('log').scrollHeight;$('status').textContent='گفت‌وگو بارگذاری شد.'}catch(e){$('status').textContent=e.message;valid=false}finally{busy=false}}$('load').onclick=refresh;$('send').onsubmit=async e=>{e.preventDefault();const message=$('message').value.trim();if(!message)return;const btn=$('sendBtn');btn.disabled=true;try{await call('send_support_chat_message',{...args(),p_message:message});$('message').value='';$('status').textContent='پیام ارسال شد.';await refresh()}catch(err){$('status').textContent=err.message}finally{btn.disabled=false}};setInterval(()=>{if(valid)refresh()},15000);const q=new URLSearchParams(location.search);if(q.get('ticket'))$('ticket').value=q.get('ticket');if(q.get('phone'))$('phone').value=q.get('phone');
})();
</script></body></html>
