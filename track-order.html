*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1c293c;font-family:Tahoma,Arial,sans-serif;line-height:1.9}.wrap{width:min(760px,94%);margin:auto}header{background:#111827;color:#fff;padding:14px 0}header .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;font-size:19px}.brand small{display:block;color:#aabbd2;font-size:10px;font-weight:400}.back{font-size:12px;color:#d9e8ff;text-decoration:none}.card{background:#fff;border:1px solid #e5eaf1;border-radius:18px;padding:clamp(17px,4vw,28px);margin:28px 0;box-shadow:0 14px 40px #172b4910}.card h1{font-size:21px;margin:0 0 5px}.muted{font-size:12px;color:#78869a;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}label{font-size:12px;color:#526177}input{width:100%;padding:12px;border:1px solid #dce4ee;border-radius:10px;font:inherit;font-size:15px;direction:ltr;text-align:right}.btn{border:0;border-radius:11px;padding:12px 18px;background:linear-gradient(110deg,#2563eb,#089dbd);color:white;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.result{margin-top:20px}.notice{padding:13px;border-radius:12px;background:#f2f5fa;color:#526177;font-size:13px}.notice.error{background:#fff1f1;color:#a32d2d}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.item{background:#f6f8fb;border-radius:11px;padding:10px}.item small{display:block;color:#7b8798;font-size:10px}.item strong{font-size:13px;overflow-wrap:anywhere}.status{padding:13px;border-radius:12px;background:#edf4ff;color:#2359a8;font-weight:800;margin:14px 0}.steps{display:grid;gap:9px;margin:18px 0}.step{display:flex;align-items:center;gap:10px;color:#8792a2;font-size:12px}.dot{width:13px;height:13px;border-radius:50%;border:2px solid #cbd5e1;background:white;flex:none}.step.done{color:#167451;font-weight:700}.step.done .dot{background:#16a36b;border-color:#16a36b;box-shadow:inset 0 0 0 3px white}.step.current{color:#225fc4;font-weight:800}.step.current .dot{border:4px solid #3478e5}.items{width:100%;border-collapse:collapse;margin-top:10px}.items th,.items td{text-align:right;border-bottom:1px solid #edf0f5;padding:9px 5px;font-size:11px}.items th{color:#7a8799}.tracking{background:#effaf5;border:1px solid #ccebdc;color:#176c4d;border-radius:12px;padding:12px;margin-top:12px;font-size:13px}.tracking a{color:inherit}.amounts{background:#f8fafc;border:1px solid #e8edf4;border-radius:12px;padding:10px 13px;margin:12px 0}.amounts>div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:12px}.amounts span{color:#718096}.amounts .grand{border-top:1px solid #dce4ee;margin-top:5px;padding-top:10px;font-weight:900;color:#1d4f91}.table-scroll{max-width:100%;overflow-x:auto}.btn-copy,.btn-again{border:0;border-radius:8px;padding:7px 10px;font:inherit;font-size:11px;cursor:pointer}.btn-copy{background:#d8f2e6;color:#176c4d}.btn-again{margin-top:14px;background:#e9eff8;color:#29466b}footer{text-align:center;color:#8994a5;font-size:11px;padding:15px 0 30px}@media(max-width:560px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.summary{grid-template-columns:1fr 1fr}.card h1{font-size:19px}}

/* RAM TAK responsive consistency */
html{overflow-x:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}body{min-width:320px;overflow-x:hidden}

 html,body{width:100%;max-width:100%;overflow-x:hidden}
 .wrap{width:calc(100% - 28px)!important;max-width:100%!important}
 header .wrap{display:flex;flex-wrap:nowrap;gap:8px}

}

body{background:linear-gradient(145deg,#f7f8fa 0%,#edf0f4 100%);color:#252a32}

.card h1{color:#252a32}

.btn{background:linear-gradient(115deg,#c8a64d,#e0c779);color:#24272c;box-shadow:0 5px 14px rgba(174,140,54,.18)}

input:focus-visible{outline:3px solid rgba(190,151,53,.22);border-color:#b99136;box-shadow:0 0 0 2px rgba(190,151,53,.12)}

<body>
<header><div class="wrap"><a class="brand" href="./">RAM TECH<small>کامپیوتر محمدی</small></a><a class="back" href="./">بازگشت به فروشگاه ←</a></div></header>
<main class="wrap"><section class="card">
<h1>پیگیری سفارش</h1><p class="muted">شماره سفارش و همان شماره موبایلی را وارد کنید که هنگام ثبت سفارش ثبت کرده‌اید.</p>
<form id="trackForm" class="grid">
<div class="field"><label for="orderNumber">شماره سفارش</label><input id="orderNumber" inputmode="numeric" autocomplete="off" required placeholder="مثلاً ۱۲۳۴۵"></div>
<div class="field"><label for="phone">شماره موبایل ثبت‌شده</label><input id="phone" inputmode="tel" autocomplete="tel" required maxlength="16" placeholder="09xxxxxxxxx"></div>
<div class="field full"><button class="btn" id="submit" type="submit">بررسی وضعیت سفارش</button></div>
</form><div id="result" class="result" aria-live="polite"></div>
</section></main><footer>© فروشگاه کامپیوتر محمدی | RAM TECH<br><a href="./support.html">ثبت درخواست پشتیبانی یا مرجوعی</a> · <a href="./policies.html">قوانین خرید و ضمانت</a></footer>
<script>
const SUPABASE_URL="https://fgfeiilkzoajguabzuex.supabase.co",SUPABASE_KEY="sb_publishable_pJ4jaKNQJA35B1kYmrtxWw_zPSuMMRB";
const $=id=>document.getElementById(id),fa=n=>Number(n||0).toLocaleString("fa-IR"),safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const digits=s=>String(s||"").replace(/[۰-۹٠-٩]/g,c=>"۰۱۲۳۴۵۶۷۸۹".indexOf(c)>=0?String("۰۱۲۳۴۵۶۷۸۹".indexOf(c)) : String("٠١٢٣٤٥٦٧٨٩".indexOf(c)));
const labels={pending:"ثبت‌شده",confirmed:"تأییدشده",processing:"در حال آماده‌سازی",shipped:"ارسال‌شده",delivered:"تحویل‌شده",cancelled:"لغو شده"};
const stages=["pending","confirmed","processing","shipped","delivered"];
function showOrder(o){
 const cancelled=o.status==="cancelled",idx=stages.indexOf(o.status);
 const steps=stages.map((st,i)=>'<div class="step '+(cancelled?"":i<idx?"done":i===idx?"current":"")+'"><span class="dot"></span><span>'+labels[st]+'</span></div>').join("");
 const items=(o.items||[]).map(x=>'<tr><td>'+safe(x.product_name)+'</td><td>'+fa(x.quantity)+'</td><td>'+fa(x.unit_price)+' تومان</td><td>'+fa(x.line_total??Number(x.unit_price)*Number(x.quantity))+' تومان</td></tr>').join("");
 const method=o.shipping_method==="tipax"?"تیپاکس":o.shipping_method==="post"?"پست":"در حال هماهنگی";
 const created=o.created_at?new Date(o.created_at):null;
 const shipped=o.shipped_at?new Date(o.shipped_at):null;
 const track=o.shipping_tracking_code?'<div class="tracking"><div>کد رهگیری ارسال</div><strong id="trackingCode">'+safe(o.shipping_tracking_code)+'</strong> <button class="btn-copy" type="button" onclick="copyTracking()">کپی کد رهگیری</button>'+(o.shipping_method==="post"?' <a href="https://tracking.post.ir/" target="_blank" rel="noopener">پیگیری در سامانه پست</a>':"")+'</div>':"";
 const payment=o.payment_status==="paid"?"پرداخت تأیید شده":o.payment_status==="refunded"?"وجه مسترد شده":o.payment_status==="failed"?"پرداخت ناموفق":"در انتظار تأیید پرداخت";
 const statusText=cancelled?"این سفارش لغو شده است.":(labels[o.status]||"در حال بررسی");
 const amountRows='<div class="amounts"><div><span>جمع کالاها</span><strong>'+fa(o.subtotal)+' تومان</strong></div><div><span>هزینه ارسال</span><strong>'+fa(o.shipping_fee)+' تومان</strong></div><div><span>تخفیف</span><strong>'+fa(o.discount)+' تومان</strong></div><div class="grand"><span>مبلغ نهایی</span><strong>'+fa(o.total)+' تومان</strong></div></div>';
 $("result").innerHTML='<div class="status">'+statusText+'</div>'+(cancelled?'<p class="muted">برای اطلاعات بیشتر درباره لغو سفارش با فروشگاه تماس بگیرید.</p>':'<div class="steps">'+steps+'</div>')+'<div class="summary"><div class="item"><small>شماره سفارش</small><strong id="orderNumberShown">'+fa(o.order_number)+'</strong> <button class="btn-copy" type="button" onclick="copyOrderNumber()">کپی شماره</button></div><div class="item"><small>تاریخ ثبت</small><strong>'+(created&&!isNaN(created)?created.toLocaleString("fa-IR"):"—")+'</strong></div><div class="item"><small>روش ارسال</small><strong>'+method+'</strong></div><div class="item"><small>وضعیت پرداخت</small><strong style="color:'+(o.payment_status==="paid"?"#167451":"#a15c12")+'">'+payment+'</strong></div>'+(shipped&&!isNaN(shipped)?'<div class="item"><small>تاریخ ارسال</small><strong>'+shipped.toLocaleDateString("fa-IR")+'</strong></div>':"")+'</div>'+amountRows+(items?'<h3>اقلام سفارش</h3><div class="table-scroll"><table class="items"><thead><tr><th>محصول</th><th>تعداد</th><th>قیمت واحد</th><th>جمع</th></tr></thead><tbody>'+items+'</tbody></table></div>':"")+track+(o.status==="shipped"&&!o.shipping_tracking_code?'<p class="notice">سفارش ارسال شده است؛ کد رهگیری پس از ثبت توسط فروشگاه در همین صفحه نمایش داده می‌شود.</p>':"")+'<button class="btn btn-again" type="button" onclick="document.getElementById(\'trackForm\').requestSubmit()">بررسی دوباره وضعیت</button>';
}
async function copyOrderNumber(){
 const el=$("orderNumberShown");if(!el)return;
 const value=digits(el.textContent).replace(/[^0-9]/g,"");
 try{await navigator.clipboard.writeText(value);const b=el.parentElement.querySelector(".btn-copy");if(b)b.textContent="کپی شد ✓"}
 catch(e){const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);const b=el.parentElement.querySelector(".btn-copy");if(b)b.textContent="شماره را انتخاب و کپی کنید"}
}
async function copyTracking(){
 const el=$("trackingCode");if(!el)return;
 try{await navigator.clipboard.writeText(el.textContent.trim());$("result").querySelector(".btn-copy").textContent="کپی شد ✓"}
 catch(e){const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);el.parentElement.querySelector(".btn-copy").textContent="کد را انتخاب و کپی کنید"}
}
$("trackForm").onsubmit=async e=>{
 e.preventDefault();
 const order=digits($("orderNumber").value).replace(/[^0-9]/g,"");
 const enteredPhone=digits($("phone").value).replace(/[^0-9]/g,"");
 let phone=enteredPhone;
 if(phone.startsWith("0098"))phone="0"+phone.slice(4);
 else if(phone.startsWith("98"))phone="0"+phone.slice(2);
 else if(/^9\d{9}$/.test(phone))phone="0"+phone;
 if(!order){$("result").innerHTML='<div class="notice error">لطفاً شماره سفارش را وارد کنید.</div>'; $("orderNumber").focus();return}
 if(!/^09\d{9}$/.test(phone)){
  $("result").innerHTML='<div class="notice error">شماره موبایل معتبر نیست. شماره را به شکل ۰۹۱۲۳۴۵۶۷۸۹ وارد کنید.</div>';
  $("phone").focus();return;
 }
 $("submit").disabled=true;$("submit").textContent="در حال بررسی...";$("result").innerHTML='<div class="notice">در حال دریافت وضعیت سفارش...</div>';
 try{
  const request=async p=>fetch(SUPABASE_URL+"/rest/v1/rpc/track_store_order",{method:"POST",headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({p_order_number:Number(order),p_phone:p})});
  let response=await request(phone);
  let data=await response.json().catch(()=>null);
  if(!response.ok)throw new Error(data?.message||"HTTP "+response.status);
  // Compatibility with older orders that may have stored the country-code form.
  if(!data&&enteredPhone!==phone&&enteredPhone.length>=10&&enteredPhone.length<=15){
   response=await request(enteredPhone);data=await response.json().catch(()=>null);
   if(!response.ok)throw new Error(data?.message||"HTTP "+response.status);
  }
  if(!data){$("result").innerHTML='<div class="notice error">سفارشی با این شماره سفارش و موبایل پیدا نشد. شماره سفارش و همان موبایلی را بررسی کنید که هنگام خرید ثبت کرده‌اید.</div>'}
  else showOrder(data);
 }
 catch(err){$("result").innerHTML='<div class="notice error">فعلاً امکان دریافت وضعیت سفارش وجود ندارد. کمی بعد دوباره تلاش کنید.</div>'}
 finally{$("submit").disabled=false;$("submit").textContent="بررسی وضعیت سفارش"}
};
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
